<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Set the theme and colour mode before first paint to avoid a flash of
			// the wrong one. An unset mode is left unset on purpose: absence is how
			// the themes spell "follow the OS", so stamping a value would override
			// the very preference the default is meant to honour.
			(function () {
				var saved = localStorage.getItem('su-theme');
				document.documentElement.dataset.theme = ['theme-1', 'theme-2'].includes(saved)
					? saved
					: 'neutral';

				var mode = localStorage.getItem('su-mode');
				if (mode === 'light' || mode === 'dark') document.documentElement.dataset.mode = mode;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
